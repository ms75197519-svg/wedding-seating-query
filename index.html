<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>婚宴座位查詢</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;600;700&display=swap');

    :root {
      --ivory: #f8f5f2;
      --ivory-strong: #efe7df;
      --gold: #b99f6a;
      --gold-soft: #d8c7a3;
      --rose: #8c6a6b;
      --rose-soft: #b8989b;
      --ink: #3a2d2d;
      --ink-soft: #6a5758;
      --line: rgba(108, 86, 74, 0.18);
      --white: #ffffff;
      --card: rgba(255, 255, 255, 0.8);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Noto Sans TC", "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f3eee9 0%, #efe6df 45%, #f6f0ec 100%);
      color: var(--ink);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 36px 14px;
    }

    .container {
      width: min(100%, 760px);
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.85);
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(76, 58, 55, 0.12), 0 4px 18px rgba(76, 58, 55, 0.04);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      overflow: hidden;
      position: relative;
    }

    .container::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(185,159,106,0.34);
      border-radius: 22px;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 20px 26px 22px;
    }

    .photo-section {
      position: relative;
      margin-bottom: 14px;
    }

    .photo-banner {
      position: relative;
      height: 340px;
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(180deg, #f0d6a8 0%, #d7e6eb 45%, #bfe4dd 100%);
      box-shadow: 0 18px 28px rgba(76,58,55,0.12), inset 0 1px 0 rgba(255,255,255,0.4);
      border: 1px solid rgba(255,255,255,0.7);
    }

    .photo-banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(20,18,18,0.08));
      z-index: 6;
      pointer-events: none;
    }

    .photo-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0), rgba(0,0,0,0.1));
      z-index: 5;
      border-radius: 20px;
    }

    .wedding-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    .couple-names {
      position: absolute;
      bottom: 26px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 10;
    }

    .couple-names-text {
      font-family: "Fredoka", sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #ffffff;
      text-shadow: 0 3px 10px rgba(0,0,0,0.25);
      margin: 0;
      line-height: 1.2;
    }

    .couple-names-sub {
      font-family: "Fredoka", sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.25em;
      color: rgba(255,255,255,0.92);
      text-shadow: 0 2px 6px rgba(0,0,0,0.2);
      margin-top: 4px;
    }

    .topbar {
      text-align: center;
      margin: 16px 0 10px;
      color: var(--gold);
      letter-spacing: 0.4em;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .hero {
      text-align: center;
      padding: 8px 0 22px;
      border-bottom: 1px solid var(--line);
      position: relative;
    }

    .hero::before,
    .hero::after {
      content: "❧";
      position: absolute;
      top: 10px;
      color: var(--gold-soft);
      font-size: 1.2rem;
    }

    .hero::before { left: 12%; }
    .hero::after { right: 12%; }

    .hero h1 {
      margin: 0;
      font-family: "Georgia", "Times New Roman", serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--rose);
    }

    .hero .subtitle {
      margin-top: 10px;
      color: var(--ink-soft);
      letter-spacing: 0.18em;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .search-wrap {
      margin-top: 24px;
    }

    .search-input {
      width: 100%;
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(140,106,107,0.18);
      border-radius: 999px;
      padding: 17px 20px;
      color: var(--ink);
      font-size: 1rem;
      outline: none;
      box-shadow: inset 0 1px 4px rgba(87,63,55,0.03);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: rgba(140,106,107,0.45);
      box-shadow: 0 0 0 4px rgba(185,159,106,0.09);
    }

    .section-label {
      margin: 24px 0 12px;
      color: var(--ink-soft);
      font-size: 0.74rem;
      letter-spacing: 0.18em;
      font-weight: 700;
    }

    .table-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 8px;
      border-radius: 18px;
      background: rgba(248,244,240,0.9);
      border: 1px solid rgba(122, 87, 75, 0.08);
      max-height: 210px;
      overflow-y: auto;
    }

    .table-buttons::-webkit-scrollbar {
      width: 7px;
    }

    .table-buttons::-webkit-scrollbar-thumb {
      background: rgba(185,159,106,0.5);
      border-radius: 999px;
    }

    .btn-table {
      border: 1px solid rgba(140,106,107,0.18);
      background: rgba(255,255,255,0.78);
      color: var(--rose);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-table:hover,
    .btn-table.active {
      background: linear-gradient(135deg, #8c6a6b, #b79682);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 8px 18px rgba(140,106,107,0.16);
      transform: translateY(-1px);
    }

    .results {
      margin-top: 24px;
      min-height: 150px;
    }

    .empty {
      text-align: center;
      line-height: 1.9;
      padding: 32px 18px;
      background: rgba(255,255,255,0.52);
      border: 1px dashed rgba(140,106,107,0.18);
      border-radius: 18px;
      color: var(--ink-soft);
    }

    .card {
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(142,120,104,0.1);
      border-left: 5px solid var(--gold);
      border-radius: 18px;
      padding: 18px 16px 14px;
      box-shadow: 0 12px 22px rgba(76, 58, 55, 0.05);
      margin-bottom: 18px;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .table-tag {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-width: 64px;
      height: 30px;
      background: linear-gradient(135deg, var(--gold), var(--gold-soft));
      color: #fff;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 0 12px;
      box-shadow: 0 6px 14px rgba(185,159,106,0.18);
    }

    .table-name {
      color: var(--rose);
      font-weight: 700;
      font-size: 1.08rem;
      letter-spacing: 0.04em;
    }

    .member-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .member-tag {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(244,238,233,0.9);
      border: 1px solid rgba(140,106,107,0.08);
      color: var(--ink-soft);
      font-size: 0.88rem;
    }

    .member-tag.highlight {
      background: linear-gradient(135deg, var(--rose), #b48d7a);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 8px 16px rgba(140,106,107,0.12);
      font-weight: 700;
    }

    .footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      text-align: center;
      color: var(--ink-soft);
      font-size: 0.78rem;
      letter-spacing: 0.14em;
    }

    @media (max-width: 560px) {
      .content {
        padding-left: 16px;
        padding-right: 16px;
      }

      .photo-banner {
        height: 240px;
      }

      .couple-names-text {
        font-size: 1.8rem;
      }

      .couple-names-sub {
        font-size: 0.85rem;
      }

      .hero::before, .hero::after {
        display: none;
      }

      .table-buttons {
        max-height: 180px;
      }
    }
  </style>
</head>

    const searchInput = document.getElementById('searchInput');
    const tableButtons = document.getElementById('tableButtons');
    const resultContainer = document.getElementById('resultContainer');

    function initButtons() {
      tableButtons.innerHTML = '';
      guestData.forEach(table => {
        const btn = document.createElement('button');
        btn.className = 'btn-table';
        btn.type = 'button';
        btn.textContent = `${table.tableNo} ${table.tableName}`;
        btn.onclick = () => {
          searchInput.value = '';
          renderTable(table.tableNo);
          setActiveButton(btn);
        };
        tableButtons.appendChild(btn);
      });
    }

    function setActiveButton(targetBtn) {
      document.querySelectorAll('.btn-table').forEach(btn => btn.classList.remove('active'));
      if (targetBtn) targetBtn.classList.add('active');
    }

    function renderTable(tableNo) {
      const table = guestData.find(item => item.tableNo === tableNo);
      if (!table) return;

      resultContainer.innerHTML = `
        <div class="card">
          <div class="card-header">
            <span class="table-tag">${table.tableNo}</span>
            <span class="table-name">${table.tableName}</span>
          </div>
          <div class="member-list">
            ${table.members.map(member => `<span class="member-tag">${member}</span>`).join('')}
          </div>
        </div>
      `;
    }

    function handleSearch() {
      const keyword = searchInput.value.trim().toLowerCase();
      setActiveButton(null);

      if (!keyword) {
        resultContainer.innerHTML = '<div class="empty">請輸入姓名關鍵字，或點擊上方桌號查看座位資訊。</div>';
        return;
      }

      const matchedTables = guestData.filter(table =>
        table.members.some(member => member.toLowerCase().includes(keyword))
      );

      if (matchedTables.length === 0) {
        resultContainer.innerHTML = '<div class="empty">查無此賓客資料，請確認輸入是否正確，或聯繫現場招待人員。</div>';
        return;
      }

      resultContainer.innerHTML = matchedTables.map(table => `
        <div class="card">
          <div class="card-header">
            <span class="table-tag">${table.tableNo}</span>
            <span class="table-name">${table.tableName}</span>
          </div>
          <div class="member-list">
            ${table.members.map(member => {
              const isMatch = member.toLowerCase().includes(keyword);
              return `<span class="member-tag ${isMatch ? 'highlight' : ''}">${member}</span>`;
            }).join('')}
          </div>
        </div>
      `).join('');
    }

    initButtons();
    resultContainer.innerHTML = '<div class="empty">請輸入姓名關鍵字，���點擊上方桌號查看座位資訊。</div>';
  </script>
