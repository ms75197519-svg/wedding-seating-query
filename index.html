<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>婚宴座位查詢</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@600;700;800&display=swap');

    :root {
      --platinum-1: #f6f4f2;
      --platinum-2: #ece7e1;
      --platinum-3: #d9d2cd;
      --silver: #9f9c99;
      --silver-deep: #6f6a68;
      --ink: #2f2a2a;
      --ink-soft: #5d5656;
      --gold: #b8a072;
      --gold-soft: #d6c4a1;
      --rose: #8b7c7c;
      --rose-soft: #b8a8a5;
      --line: rgba(95, 88, 86, 0.15);
      --white: #ffffff;
      --card: rgba(255,255,255,0.82);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Noto Sans TC", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.82), rgba(255,255,255,0) 28%),
        linear-gradient(180deg, #f3f1ee 0%, #ece7e2 42%, #f6f3f1 100%);
      color: var(--ink);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 36px 14px;
    }

    .container {
      width: min(100%, 760px);
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 32px;
      box-shadow: 0 20px 50px rgba(88, 81, 79, 0.08), 0 6px 18px rgba(88,81,79,0.04);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: hidden;
      position: relative;
    }

    .container::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(184,160,114,0.28);
      border-radius: 24px;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 28px 26px 28px;
    }

    .invitation-header {
      text-align: center;
      padding: 20px 0 18px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
      position: relative;
    }

    .invitation-header::before,
    .invitation-header::after {
      content: "✦";
      position: absolute;
      top: 12px;
      color: var(--gold-soft);
      font-size: 1rem;
    }

    .invitation-header::before { left: 22px; }
    .invitation-header::after { right: 22px; }

    .couple-names-section {
      text-align: center;
      padding-top: 4px;
    }

    .couple-names {
      font-family: "Cormorant Garamond", "Playfair Display", serif;
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 600;
      letter-spacing: 0.10em;
      color: var(--silver-deep);
      margin: 0;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .couple-subtitle {
      font-family: "Noto Sans TC", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      color: var(--gold);
      margin-top: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .topbar {
      text-align: center;
      margin: 18px 0 10px;
      color: var(--gold);
      letter-spacing: 0.42em;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .hero {
      text-align: center;
      padding: 12px 0 16px;
      border-bottom: 1px solid var(--line);
      position: relative;
      margin-bottom: 2px;
    }

    .hero::before,
    .hero::after {
      content: "◆";
      position: absolute;
      top: 16px;
      color: var(--gold-soft);
      font-size: 0.78rem;
      letter-spacing: 0.15em;
    }

    .hero::before { left: 14%; }
    .hero::after { right: 14%; }

    .hero h1 {
      margin: 0;
      font-family: "Playfair Display", "Georgia", serif;
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--silver-deep);
    }

    .hero .subtitle {
      margin-top: 8px;
      color: var(--gold);
      letter-spacing: 0.2em;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .search-wrap {
      margin-top: 24px;
    }

    .search-input {
      width: 100%;
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(161,154,150,0.26);
      border-radius: 999px;
      padding: 17px 20px;
      color: var(--ink);
      font-size: 0.96rem;
      outline: none;
      box-shadow: inset 0 1px 4px rgba(87,63,55,0.02);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: rgba(146,137,132,0.5);
      box-shadow: 0 0 0 4px rgba(184,160,114,0.08);
    }

    .search-input::placeholder {
      color: rgba(93,86,86,0.56);
    }

    .section-label {
      margin: 28px 0 14px;
      color: var(--gold);
      font-size: 0.7rem;
      letter-spacing: 0.26em;
      font-weight: 700;
      text-transform: uppercase;
      text-align: center;
    }

    .table-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 8px;
      border-radius: 18px;
      background: rgba(245,242,239,0.82);
      border: 1px solid rgba(122, 117, 114, 0.08);
      max-height: 210px;
      overflow-y: auto;
    }

    .table-buttons::-webkit-scrollbar {
      width: 7px;
    }

    .table-buttons::-webkit-scrollbar-thumb {
      background: rgba(184,160,114,0.5);
      border-radius: 999px;
    }

    .btn-table {
      border: 1px solid rgba(160,152,149,0.2);
      background: rgba(255,255,255,0.8);
      color: var(--silver-deep);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.04em;
    }

    .btn-table:hover {
      background: rgba(255,255,255,0.96);
      border-color: rgba(184,160,114,0.45);
      color: var(--silver-deep);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(184,160,114,0.12);
    }

    .btn-table.active {
      background: linear-gradient(135deg, #8b8a8a, #b0a59d);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 6px 16px rgba(115,110,108,0.15);
    }

    .results {
      margin-top: 24px;
      min-height: 150px;
    }

    .empty {
      text-align: center;
      line-height: 1.9;
      padding: 32px 18px;
      background: rgba(255,255,255,0.52);
      border: 1px dashed rgba(140,138,136,0.22);
      border-radius: 18px;
      color: var(--ink-soft);
      font-size: 0.92rem;
    }

    .card {
      background: rgba(255,255,255,0.85);
      border: 1px solid rgba(184,160,114,0.14);
      border-left: 4px solid var(--gold);
      border-radius: 16px;
      padding: 16px 16px 14px;
      box-shadow: 0 8px 22px rgba(76, 58, 55, 0.04);
      margin-bottom: 16px;
      transition: all 0.2s ease;
    }

    .card:hover {
      box-shadow: 0 12px 24px rgba(76, 58, 55, 0.07);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .table-tag {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-width: 60px;
      height: 28px;
      background: linear-gradient(135deg, var(--gold), var(--gold-soft));
      color: #fff;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 0 10px;
      box-shadow: 0 5px 12px rgba(184,160,114,0.16);
    }

    .table-name {
      color: var(--rose);
      font-weight: 700;
      font-size: 1.03rem;
      letter-spacing: 0.04em;
    }

    .member-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .member-tag {
      display: inline-block;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(244,240,235,0.95);
      border: 1px solid rgba(184,160,114,0.12);
      color: var(--ink-soft);
      font-size: 0.84rem;
      transition: all 0.2s ease;
    }

    .member-tag:hover {
      background: rgba(244,240,235,1);
      border-color: rgba(184,160,114,0.3);
    }

    .member-tag.highlight {
      background: linear-gradient(135deg, #b1a7a4, #867d7d);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 6px 14px rgba(130,122,120,0.12);
      font-weight: 600;
    }

    .footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      text-align: center;
      color: var(--ink-soft);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      font-weight: 500;
    }

    .footer::before {
      content: "❖ ";
      color: var(--gold);
      margin-right: 4px;
    }

    .footer::after {
      content: " ❖";
      color: var(--gold);
      margin-left: 4px;
    }

    @media (max-width: 560px) {
      .content {
        padding-left: 16px;
        padding-right: 16px;
        padding-top: 20px;
        padding-bottom: 20px;
      }

      .invitation-header {
        padding: 16px 0 14px;
        margin-bottom: 18px;
      }

      .couple-names {
        letter-spacing: 0.08em;
      }

      .hero h1 {
        font-size: 1.7rem;
      }

      .hero::before, .hero::after {
        display: none;
      }

      .invitation-header::before,
      .invitation-header::after {
        font-size: 0.9rem;
        top: 10px;
      }

      .table-buttons {
        max-height: 180px;
      }

      .member-tag {
        font-size: 0.8rem;
        padding: 5px 9px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <div class="invitation-header">
        <div class="couple-names-section">
          <p class="couple-names">新郎 & 新娘</p>
          <div class="couple-subtitle">WEDDING</div>
        </div>
      </div>

      <div class="topbar">Wedding Invitation</div>

      <div class="hero">
        <h1>婚宴座位查詢</h1>
        <div class="subtitle">Wedding Seating Guide</div>
      </div>

      <div class="search-wrap">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="請輸入賓客姓名查詢座位"
          oninput="handleSearch()"
          aria-label="搜尋姓名"
        />
      </div>

      <div class="section-label">快速選擇桌號</div>
      <div class="table-buttons" id="tableButtons"></div>

      <div class="results" id="resultContainer"></div>

      <div class="footer">感謝蒞臨　祝福幸福美滿</div>
    </div>
  </div>

  <script>
    const guestData = [
      { tableName: "田徑朋友", tableNo: "1-1", members: ["張偉銘", "黃俊勝", "劉家源", "劉羽哲", "林家顥", "周李擎", "周郁晏", "林庭瑋"] },
      { tableName: "新郎大學朋友", tableNo: "2-1", members: ["陳冠諺", "宋郁均", "林芝豪", "王約翰", "宋思賢", "陳冠綸", "蔡丞祐"] },
      { tableName: "大學朋友", tableNo: "2-2", members: ["黃建綱", "張家陞", "魏小草", "鄧培昕", "李宗育", "翁偉誠"] },
      { tableName: "媽媽親戚", tableNo: "3-1", members: ["大阿姨", "三阿姨", "四阿姨", "五阿姨"] },
      { tableName: "廖家親戚", tableNo: "3-2", members: ["親戚", "力勳", "舅媽"] },
      { tableName: "國小朋友", tableNo: "3-3", members: ["林瑞吉", "李永祥", "呂學智", "廖烜慶", "陳芃諭", "曾續觀", "劉芷彤"] },
      { tableName: "高中老師", tableNo: "3-5", members: ["葉怡君", "林宥婷", "莊晴惠", "陳佳蓮", "何叔俞(Fish)", "彭珊珊", "朱明芳", "鄭竹君"] },
      { tableName: "田徑朋友", tableNo: "3-6", members: ["劉學康", "林辰洋", "黃平諺", "楊凱惟", "郭岳霖", "曾韋誠", "黃健成"] },
      { tableName: "(男) 內小4", tableNo: "3-7", members: ["陳宏建", "林慶曉", "陳燕玉", "蕭蘊慧", "林桂馨", "陳謙豪"] },
      { tableName: "(男) 內小5", tableNo: "3-8", members: ["林郁臻(容暢)", "宋心柔(可芸)", "李怡君(艾倪)"] },
      { tableName: "男方親戚", tableNo: "5-1", members: ["廖月溶", "瑋瑋", "秋秋", "林佳靜", "林秀曼"] },
      { tableName: "爸爸親友", tableNo: "5-2", members: ["李慶源", "廖英利", "李謀瑀", "張余美珠"] },
      { tableName: "田徑教練", tableNo: "5-3", members: ["鄔惟喬", "翁竹毅", "張倩菱", "邱為榮", "張浩桂", "潘瑞根", "林芝羽", "詹傳幃"] },
      { tableName: "(男) 內小1", tableNo: "5-5", members: ["朱怡珊", "留金山", "林文政", "莊國僑", "于德桂", "許顯銘", "邱奕帆", "盧宗德"] },
      { tableName: "(男) 內小2", tableNo: "5-6", members: ["許璋銜", "劉彥宏", "賴協軍", "陳盈璋", "黃至德"] },
      { tableName: "(男) 內小3", tableNo: "5-7", members: ["魏莉珩", "温雅玲", "姚良澤", "蕭若妍", "張嘉漢"] },
      { tableName: "蔡氏家族1", tableNo: "6-1", members: ["許秀慧(大伯母)", "張佩菁(二伯母)", "蔡秀霞(大姑姑)", "蔡寶卿(二姑姑)", "蔡蕙蘭(三姑姑)", "蔡素美(小姑姑)"] },
      { tableName: "李氏家族", tableNo: "6-2", members: ["吳美芳(大舅媽)", "李志揚(小舅)", "李惠美(阿姨)", "謝慈容", "林正東"] },
      { tableName: "蔡氏家族2", tableNo: "6-3", members: ["蔡忠雄(三伯父)", "蔡文發(小叔叔)", "陳嘉興", "陳信价"] },
      { tableName: "詩涵同學", tableNo: "6-5", members: ["林昱君", "楊雅菁", "劉迦恩", "李姿學", "曾湘芩", "高毓翎（綠豬）", "陳宥瑾", "周鈺庭", "陳佳澤"] },
      { tableName: "(女) 內小4", tableNo: "6-6", members: ["蔡文鴻", "魏士淵", "吳仁傑", "張竣瑋", "黃可豪", "蔡沅蓓", "陳亦辰"] },
      { tableName: "(女) 內小1", tableNo: "6-7", members: ["楊立銘(芝瑄)", "李亞貞(郁玹)", "李沛穎(哲安)", "郭家卉(亭瑀)"] },
      { tableName: "蔡氏家族3", tableNo: "7-1", members: ["蔡秉諺", "郭潔蓮"] },
      { tableName: "蔡氏家族6", tableNo: "7-2", members: ["林意萍", "林佳慧", "林佳伶", "洪靜馨"] },
      { tableName: "媽媽同事", tableNo: "7-3", members: ["吳建村", "鄭斯仲", "陳慧伶", "林日紹", "王清銀", "謝德隆"] },
      { tableName: "蔡氏家族4", tableNo: "7-5", members: ["蔡佩珊", "郭振宇", "陳春模", "李昀儒媽媽", "蔡斯恩"] },
      { tableName: "蔡氏家族5", tableNo: "7-6", members: ["莊欣昌", "莊欣怡", "蔡秉璜"] },
      { tableName: "(女) 內小2", tableNo: "7-7", members: ["鍾美惠", "黃淑意", "徐語潔", "林虹妧", "劉欣蕙", "洪于婷", "李麗宜"] },
      { tableName: "(女) 內小3", tableNo: "7-8", members: ["廖珊虹", "郭怡今", "江采恩", "林亭均", "廖珠惠(麗小主任)", "陳慧蓮(麗小老師)", "賴素卿(麗小老師)", "Ruby", "Chad"] }
    ];

    const searchInput = document.getElementById('searchInput');
    const tableButtons = document.getElementById('tableButtons');
    const resultContainer = document.getElementById('resultContainer');

    function initButtons() {
      tableButtons.innerHTML = '';
      guestData.forEach(table => {
        const btn = document.createElement('button');
        btn.className = 'btn-table';
        btn.type = 'button';
        btn.textContent = `${table.tableNo} ${table.tableName}`;
        btn.onclick = () => {
          searchInput.value = '';
          renderTable(table.tableNo);
          setActiveButton(btn);
        };
        tableButtons.appendChild(btn);
      });
    }

    function setActiveButton(targetBtn) {
      document.querySelectorAll('.btn-table').forEach(btn => btn.classList.remove('active'));
      if (targetBtn) targetBtn.classList.add('active');
    }

    function renderTable(tableNo) {
      const table = guestData.find(item => item.tableNo === tableNo);
      if (!table) return;

      resultContainer.innerHTML = `
        <div class="card">
          <div class="card-header">
            <span class="table-tag">${table.tableNo}</span>
            <span class="table-name">${table.tableName}</span>
          </div>
          <div class="member-list">
            ${table.members.map(member => `<span class="member-tag">${member}</span>`).join('')}
          </div>
        </div>
      `;
    }

    function handleSearch() {
      const keyword = searchInput.value.trim().toLowerCase();
      setActiveButton(null);

      if (!keyword) {
        resultContainer.innerHTML = '<div class="empty">請輸入姓名關鍵字查詢座位，或點擊上方桌號快速瀏覽。</div>';
        return;
      }

      const matchedTables = guestData.filter(table =>
        table.members.some(member => member.toLowerCase().includes(keyword))
      );

      if (matchedTables.length === 0) {
        resultContainer.innerHTML = '<div class="empty">查無此賓客資料，請確認輸入是否正確，或聯繫現場招待人員。</div>';
        return;
      }

      resultContainer.innerHTML = matchedTables.map(table => `
        <div class="card">
          <div class="card-header">
            <span class="table-tag">${table.tableNo}</span>
            <span class="table-name">${table.tableName}</span>
          </div>
          <div class="member-list">
            ${table.members.map(member => {
              const isMatch = member.toLowerCase().includes(keyword);
              return `<span class="member-tag ${isMatch ? 'highlight' : ''}">${member}</span>`;
            }).join('')}
          </div>
        </div>
      `).join('');
    }

    initButtons();
    resultContainer.innerHTML = '<div class="empty">請輸入姓名關鍵字查詢座位，或點擊上方桌號快速瀏覽。</div>';
  </script>
</body>
</html>
