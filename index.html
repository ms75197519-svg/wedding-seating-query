<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>婚宴座位查詢</title>
  <style>
    :root {
      --ivory: #f8f5f2;
      --ivory-strong: #efe7df;
      --gold: #b99f6a;
      --gold-soft: #d8c7a3;
      --rose: #8c6a6b;
      --rose-soft: #b8989b;
      --ink: #3a2d2d;
      --ink-soft: #6a5758;
      --line: rgba(108, 86, 74, 0.18);
      --white: #ffffff;
      --card: rgba(255, 255, 255, 0.8);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(180deg, #f3eee9 0%, #efe6df 45%, #f6f0ec 100%);
      color: var(--ink);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 36px 14px;
    }

    .container {
      width: min(100%, 760px);
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.85);
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(76, 58, 55, 0.12), 0 4px 18px rgba(76, 58, 55, 0.04);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      overflow: hidden;
      position: relative;
    }

    .container::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(185,159,106,0.34);
      border-radius: 22px;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 20px 26px 22px;
    }

    .photo-banner {
      position: relative;
      height: 340px;
      border-radius: 22px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(30, 22, 22, 0.08), rgba(20, 14, 15, 0.18)),
        url('input_file_0.png') center center / cover no-repeat;
      box-shadow: 0 18px 28px rgba(76,58,55,0.12);
      border: 1px solid rgba(255,255,255,0.7);
    }

    .photo-banner::after {
      content: "新婚紀念 - Wedding Story";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 20px;
      background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,0.42));
      color: #fff;
      letter-spacing: 0.12em;
      font-size: 0.72rem;
      text-align: center;
    }

    .topbar {
      text-align: center;
      margin: 18px 0 10px;
      color: var(--gold);
      letter-spacing: 0.4em;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .hero {
      text-align: center;
      padding: 8px 0 22px;
      border-bottom: 1px solid var(--line);
      position: relative;
    }

    .hero::before,
    .hero::after {
      content: "❧";
      position: absolute;
      top: 10px;
      color: var(--gold-soft);
      font-size: 1.2rem;
    }

    .hero::before { left: 12%; }
    .hero::after { right: 12%; }

    .hero h1 {
      margin: 0;
      font-family: "Georgia", "Times New Roman", serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--rose);
    }

    .hero .subtitle {
      margin-top: 10px;
      color: var(--ink-soft);
      letter-spacing: 0.18em;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .search-wrap {
      margin-top: 24px;
    }

    .search-input {
      width: 100%;
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(140,106,107,0.18);
      border-radius: 999px;
      padding: 17px 20px;
      color: var(--ink);
      font-size: 1rem;
      outline: none;
      box-shadow: inset 0 1px 4px rgba(87,63,55,0.03);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: rgba(140,106,107,0.45);
      box-shadow: 0 0 0 4px rgba(185,159,106,0.09);
    }

    .section-label {
      margin: 24px 0 12px;
      color: var(--ink-soft);
      font-size: 0.74rem;
      letter-spacing: 0.18em;
      font-weight: 700;
    }

    .table-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 8px;
      border-radius: 18px;
      background: rgba(248,244,240,0.9);
      border: 1px solid rgba(122, 87, 75, 0.08);
      max-height: 210px;
      overflow-y: auto;
    }

    .table-buttons::-webkit-scrollbar {
      width: 7px;
    }

    .table-buttons::-webkit-scrollbar-thumb {
      background: rgba(185,159,106,0.5);
      border-radius: 999px;
    }

    .btn-table {
      border: 1px solid rgba(140,106,107,0.18);
      background: rgba(255,255,255,0.78);
      color: var(--rose);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-table:hover,
    .btn-table.active {
      background: linear-gradient(135deg, #8c6a6b, #b79682);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 8px 18px rgba(140,106,107,0.16);
      transform: translateY(-1px);
    }

    .results {
      margin-top: 24px;
      min-height: 150px;
    }

    .empty {
      text-align: center;
      line-height: 1.9;
      padding: 32px 18px;
      background: rgba(255,255,255,0.52);
      border: 1px dashed rgba(140,106,107,0.18);
      border-radius: 18px;
      color: var(--ink-soft);
    }

    .card {
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(142,120,104,0.1);
      border-left: 5px solid var(--gold);
      border-radius: 18px;
      padding: 18px 16px 14px;
      box-shadow: 0 12px 22px rgba(76, 58, 55, 0.05);
      margin-bottom: 18px;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .table-tag {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-width: 64px;
      height: 30px;
      background: linear-gradient(135deg, var(--gold), var(--gold-soft));
      color: #fff;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 0 12px;
      box-shadow: 0 6px 14px rgba(185,159,106,0.18);
    }

    .table-name {
      color: var(--rose);
      font-weight: 700;
      font-size: 1.08rem;
      letter-spacing: 0.04em;
    }

    .member-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .member-tag {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(244,238,233,0.9);
      border: 1px solid rgba(140,106,107,0.08);
      color: var(--ink-soft);
      font-size: 0.88rem;
    }

    .member-tag.highlight {
      background: linear-gradient(135deg, var(--rose), #b48d7a);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 8px 16px rgba(140,106,107,0.12);
      font-weight: 700;
    }

    .footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      text-align: center;
      color: var(--ink-soft);
      font-size: 0.78rem;
      letter-spacing: 0.14em;
    }

    @media (max-width: 560px) {
      .content {
        padding-left: 16px;
        padding-right: 16px;
      }

      .photo-banner {
        height: 240px;
      }

      .hero::before, .hero::after {
        display: none;
      }

      .table-buttons {
        max-height: 180px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <div class="photo-banner" aria-label="婚宴照片"></div>

      <div class="topbar">WEDDING INVITATION</div>

      <div class="hero">
        <h1>婚宴座位查詢</h1>
        <div class="subtitle">Wedding Seating Guide</div>
      </div>

      <div class="search-wrap">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="請輸入姓名查詢座位，例如：劉家源、魏莉珩"
          oninput="handleSearch()"
          aria-label="搜尋姓名"
        />
      </div>

      <div class="section-label">快速選擇桌號</div>
      <div class="table-buttons" id="tableButtons"></div>

      <div class="results" id="resultContainer"></div>

      <div class="footer">感謝蒞臨 祝福幸福美滿</div>
    </div>
  </div>

  <script>
    const guestData = [
      { tableName: "田徑朋友", tableNo: "1-1", members: ["張偉銘", "黃俊勝", "劉家源", "劉羽哲", "林家顥", "周李擎", "周郁晏", "林庭瑋"] },
      { tableName: "大學朋友", tableNo: "2-1", members: ["陳冠諺", "宋郁均", "林芝豪", "王約翰", "宋思賢", "陳冠綸", "蔡丞祐"] },
      { tableName: "大學朋友", tableNo: "2-2", members: ["黃建綱", "張家陞", "魏小草", "鄧培昕", "李宗育", "翁偉誠"] },
      { tableName: "媽媽親戚", tableNo: "3-1", members: ["大阿姨", "三阿姨", "四阿姨", "五阿姨"] },
      { tableName: "廖家親戚", tableNo: "3-2", members: ["親戚", "力勳", "舅媽"] },
      { tableName: "國小朋友", tableNo: "3-3", members: ["林瑞吉", "李永祥", "呂學智", "廖烜慶", "陳芃諭", "曾續觀", "劉芷彤"] },
      { tableName: "高中老師", tableNo: "3-5", members: ["葉怡君", "林宥婷", "莊晴惠", "陳佳蓮", "FISH", "彭珊珊", "朱明芳", "鄭竹君"] },
      { tableName: "田徑朋友", tableNo: "3-6", members: ["劉學康", "林辰洋", "黃平諺", "楊凱惟", "郭岳霖", "曾韋誠", "黃建成"] },
      { tableName: "(男) 內小4", tableNo: "3-7", members: ["陳宏建", "林慶曉", "燕玉", "蕭蘊慧", "陳桂馨", "陳謙豪"] },
      { tableName: "(男) 內小5", tableNo: "3-8", members: ["容暢家", "宋心柔(可芸)", "李怡君(艾倪)"] },
      { tableName: "男方親戚", tableNo: "5-1", members: ["月溶", "瑋瑋", "秋秋", "佳靜", "秀曼"] },
      { tableName: "爸爸朋友", tableNo: "5-2", members: ["李慶源", "廖英利", "李謀瑀", "張余美珠"] },
      { tableName: "田徑教練", tableNo: "5-3", members: ["鄔惟喬", "翁竹毅", "張倩菱", "邱為榮", "張浩桂", "潘瑞根", "林芝羽", "詹傳幃"] },
      { tableName: "(男) 內小1", tableNo: "5-5", members: ["朱怡珊", "小留哥", "林爸", "大哥", "于老師", "許顯銘", "邱奕帆", "盧宗德"] },
      { tableName: "(男) 內小2", tableNo: "5-6", members: ["許璋銜", "劉彥宏", "賴協軍", "陳盈璋", "黃至德"] },
      { tableName: "(男) 內小3", tableNo: "5-7", members: ["魏莉珩", "温雅玲", "姚良澤", "蕭若妍", "張嘉漢"] },
      { tableName: "蔡氏家族1", tableNo: "6-1", members: ["大伯母", "二伯母", "大姑姑", "二姑姑", "三姑姑", "小姑姑"] },
      { tableName: "李氏家族", tableNo: "6-2", members: ["大舅媽", "小舅", "惠美姨", "謝慈容", "林正東"] },
      { tableName: "蔡氏家族2", tableNo: "6-3", members: ["三伯父", "小叔叔", "陳嘉興", "陳信价"] },
      { tableName: "詩涵同學", tableNo: "6-5", members: ["林昱君", "楊雅菁", "劉迦恩", "李姿學", "曾湘芩", "高毓翎（綠豬）", "陳宥瑾", "周鈺庭", "陳佳澤"] },
      { tableName: "(女) 內小4", tableNo: "6-6", members: ["文鴻", "士淵", "仁傑", "竣瑋", "可豪", "蔡沅蓓", "亦辰"] },
      { tableName: "(女) 內小1", tableNo: "6-7", members: ["楊立銘(芝瑄)", "郁玹", "李沛穎(哲安)", "郭家卉(亭瑀)"] },
      { tableName: "蔡氏家族3", tableNo: "7-1", members: ["蔡秉諺", "郭潔蓮"] },
      { tableName: "蔡氏家族6", tableNo: "7-2", members: ["林意萍", "林佳慧", "林佳伶", "洪靜馨"] },
      { tableName: "媽媽同事", tableNo: "7-3", members: ["吳建村", "鄭斯仲", "陳慧伶", "林日紹", "王清銀", "謝德隆"] },
      { tableName: "蔡氏家族4", tableNo: "7-5", members: ["蔡佩珊", "郭振宇", "陳春模", "李昀儒媽媽", "蔡斯恩"] },
      { tableName: "蔡氏家族5", tableNo: "7-6", members: ["莊欣昌", "莊欣怡", "蔡秉璜"] },
      { tableName: "(女) 內小2", tableNo: "7-7", members: ["美惠", "淑意", "語潔", "虹妧", "欣蕙", "于婷", "麗宜"] },
      { tableName: "(女) 內小3", tableNo: "7-8", members: ["珊虹", "怡今", "采恩", "亭均", "珠惠主任", "慧蓮老師", "麗小Ms.Lai", "Ruby", "Chad"] }
    ];

    const searchInput = document.getElementById('searchInput');
    const tableButtons = document.getElementById('tableButtons');
    const resultContainer = document.getElementById('resultContainer');

    function initButtons() {
      tableButtons.innerHTML = '';
      guestData.forEach(table => {
        const btn = document.createElement('button');
        btn.className = 'btn-table';
        btn.type = 'button';
        btn.textContent = `${table.tableNo} ${table.tableName}`;
        btn.onclick = () => {
          searchInput.value = '';
          renderTable(table.tableNo);
          setActiveButton(btn);
        };
        tableButtons.appendChild(btn);
      });
    }

    function setActiveButton(targetBtn) {
      document.querySelectorAll('.btn-table').forEach(btn => btn.classList.remove('active'));
      if (targetBtn) targetBtn.classList.add('active');
    }

    function renderTable(tableNo) {
      const table = guestData.find(item => item.tableNo === tableNo);
      if (!table) return;

      resultContainer.innerHTML = `
        <div class="card">
          <div class="card-header">
            <span class="table-tag">${table.tableNo}</span>
            <span class="table-name">${table.tableName}</span>
          </div>
          <div class="member-list">
            ${table.members.map(member => `<span class="member-tag">${member}</span>`).join('')}
          </div>
        </div>
      `;
    }

    function handleSearch() {
      const keyword = searchInput.value.trim().toLowerCase();
      setActiveButton(null);

      if (!keyword) {
        resultContainer.innerHTML = '<div class="empty">請輸入姓名關鍵字，或點擊上方桌號查看座位資訊。</div>';
        return;
      }

      const matchedTables = guestData.filter(table =>
        table.members.some(member => member.toLowerCase().includes(keyword))
      );

      if (matchedTables.length === 0) {
        resultContainer.innerHTML = '<div class="empty">查無此賓客資料，請確認輸入是否正確，或聯繫現場招待人員。</div>';
        return;
      }

      resultContainer.innerHTML = matchedTables.map(table => `
        <div class="card">
          <div class="card-header">
            <span class="table-tag">${table.tableNo}</span>
            <span class="table-name">${table.tableName}</span>
          </div>
          <div class="member-list">
            ${table.members.map(member => {
              const isMatch = member.toLowerCase().includes(keyword);
              return `<span class="member-tag ${isMatch ? 'highlight' : ''}">${member}</span>`;
            }).join('')}
          </div>
        </div>
      `).join('');
    }

    initButtons();
    resultContainer.innerHTML = '<div class="empty">請輸入姓名關鍵字，或點擊上方桌號查看座位資訊。</div>';
  </script>
</body>
</html>
